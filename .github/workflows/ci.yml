name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium

      - name: Run web tests
        run: npm run test:web
        # Mobile tests need a running Appium server + device/emulator and are
        # intentionally excluded from this job: npm run test:mobile
